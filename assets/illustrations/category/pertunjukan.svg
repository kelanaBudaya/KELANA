<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <g id="backdrop">
    <circle cx="60" cy="60" r="54" fill="#FDD98A"/>
  </g>

  <g id="control-rods">
    <!-- Main central horn gapit rod rising through torso and neck -->
    <line x1="57" y1="112" x2="62" y2="54" stroke="#975A33" stroke-width="2" stroke-linecap="round"/>
    <!-- Lower wooden handle of the gapit -->
    <path d="M 55.5 96 L 59.5 96 L 58.2 112 C 58.1 113.2 56.3 113.2 56.2 112 Z" fill="#975A33"/>
    <path d="M 55 95 L 60 95 L 60 97.5 L 55 97.5 Z" fill="#F7B02B"/>
    <!-- Secondary thin arm control rod (cempurit) on the right -->
    <line x1="84" y1="88" x2="88" y2="110" stroke="#975A33" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="84" cy="88" r="1.8" fill="#F7B02B"/>
  </g>

  <g id="wayang-shoulders-and-torso">
    <!-- Back wing ornament (praba base) behind left shoulder -->
    <path d="M 42 74 C 31 70 25 60 27 49 C 30 56 36 60 44 62 C 37 54 36 44 41 37 C 43 45 48 51 54 55 L 52 76 Z" fill="#2F3A8F"/>
    <path d="M 41 69 C 34 65 30 59 31 53 C 34 58 39 61 45 63 Z" fill="#F7B02B"/>
    <path d="M 45 59 C 41 53 40 47 43 42 C 45 48 49 52 53 55 Z" fill="#FFF7E5"/>

    <!-- Main angled Wayang shoulders and upper chest silhouette -->
    <path d="M 30 82 C 30 77 35 74 42 73 L 56 71 L 67 72 L 82 77 C 87 79 90 83 88 88 L 83 96 C 81 98 78 99 74 98 L 67 89 L 65 98 L 47 98 L 45 87 L 37 94 C 34 96 30 94 30 89 Z" fill="#171512"/>

    <!-- Ornate golden collar (kalung ulur) on torso -->
    <path d="M 46 73 C 50 81 56 85 63 85 C 69 85 74 81 77 75 L 73 74 C 70 78 67 81 63 81 C 57 81 53 78 50 72 Z" fill="#F7B02B"/>
    <path d="M 52 84 C 55 89 59 92 63 92 C 67 92 70 89 73 85 C 69 87 66 88 63 88 C 59 88 55 86 52 84 Z" fill="#FFF7E5"/>
    <circle cx="63" cy="95" r="1.8" fill="#F7B02B"/>

    <!-- Left and right shoulder ornaments (kelat bahu) -->
    <path d="M 33 81 C 35 77 39 76 44 76 L 42 84 C 38 85 35 84 33 81 Z" fill="#F7B02B"/>
    <circle cx="38" cy="80" r="1.4" fill="#FFF7E5"/>
    <path d="M 78 79 C 82 80 85 82 86 86 C 82 87 79 86 76 83 Z" fill="#F7B02B"/>
    <circle cx="81" cy="83" r="1.4" fill="#FFF7E5"/>
  </g>

  <g id="wayang-head-and-gelung">
    <!-- Slender inclined neck -->
    <path d="M 55 73 L 59 56 L 69 58 L 67 74 Z" fill="#171512"/>
    <!-- Neck tendon / ornament cut-in lines -->
    <path d="M 59 71 L 62 59 L 64 59.5 L 61.5 71.5 Z" fill="#F7B02B"/>

    <!-- Tall backward-curving lobster-claw headdress (Gelung Supit Urang) -->
    <path d="M 57 57 C 43 56 31 46 28 32 C 26 21 32 13 41 13 C 48 13 53 18 52 24 C 51 28 47 30 44 28 C 46 26 46 22 43 20 C 39 18 35 22 36 29 C 37 38 45 45 55 45 C 52 38 53 30 59 26 C 64 22 72 24 76 31 L 78 39 Z" fill="#171512"/>

    <!-- Inner indigo layer inside Gelung arch -->
    <path d="M 54 51 C 42 49 33 40 32 29 C 31 22 35 17 40 16 C 36 19 35 24 36 30 C 38 39 46 46 56 47 Z" fill="#2F3A8F"/>

    <!-- Fine filigree cut-ins (tatah) along the Gelung curve -->
    <circle cx="33" cy="31" r="1.5" fill="#FFF7E5"/>
    <circle cx="35" cy="37" r="1.6" fill="#F7B02B"/>
    <circle cx="39" cy="43" r="1.7" fill="#FFF7E5"/>
    <circle cx="44" cy="48" r="1.8" fill="#F7B02B"/>
    <circle cx="50" cy="51" r="1.6" fill="#FFF7E5"/>
    <path d="M 38 15 C 43 14 48 17 49 22 C 47 19 43 17 38 17 Z" fill="#F7B02B"/>

    <!-- Garuda Mungkur (back-of-head mythical ornament clip on the Gelung) -->
    <path d="M 46 48 C 42 46 40 41 43 37 C 46 34 52 35 55 40 L 53 49 Z" fill="#F7B02B"/>
    <path d="M 45 43 C 44 40 46 38 49 38 C 51 39 52 41 51 44 Z" fill="#171512"/>
    <circle cx="48" cy="41" r="1.3" fill="#FFF7E5"/>

    <!-- Strict side-profile Wayang head (facing right, tilted slightly downward) -->
    <!-- Forehead, long pointed aristocratic nose, upper lip, tucked chin, jawline -->
    <path d="M 59 56 L 62 36 L 77 36 C 79 41 83 45 96 49 C 97.5 49.5 97.5 51 95.5 51.4 L 83 53.5 L 85.5 55.5 C 86.2 56.2 85.8 57.2 84.5 57.5 L 81.5 58 L 83 60 C 83.6 61.2 82.5 62.8 80.5 62.8 C 76 62.8 71 60.5 67 58 Z" fill="#171512"/>

    <!-- Forehead crown diadem (Jamang) & pointed spire -->
    <path d="M 57 38 C 61 32 68 29 76 31 L 78 24 C 79 28 80 32 79 37 C 72 35 64 36 58 41 Z" fill="#F7B02B"/>
    <path d="M 62 35 C 67 33 72 33 77 35 L 76 37 C 71 35.5 66 35.5 61 37 Z" fill="#FFF7E5"/>
    <!-- Tiny red jewel accent on the crown diadem -->
    <circle cx="76" cy="34" r="2" fill="#D6402F"/>

    <!-- Sweeping ear ornament (Sumping) extending back from temple to cheek -->
    <path d="M 64 56 C 57 54 52 48 50 40 C 54 41 58 44 61 48 C 58 42 58 36 62 32 C 63 37 66 43 70 47 L 67 56 Z" fill="#F7B02B"/>
    <path d="M 64 53 C 59 51 55 47 54 42 C 57 44 60 47 63 50 Z" fill="#FFF7E5"/>
    <circle cx="65" cy="51" r="1.5" fill="#171512"/>

    <!-- Narrow Wayang eye slit (liyepan / refined almond slit) and brow line -->
    <path d="M 73 43.5 C 76 42.2 80 42.8 83 45" stroke="#F7B02B" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 72 46.5 L 82 47.8 L 76 49.2 Z" fill="#FFF7E5"/>
    <circle cx="77" cy="47.5" r="1" fill="#171512"/>

    <!-- Subtle golden facial contour highlight along the long nose and cheek -->
    <path d="M 79 39 C 81 43 85 46 94 49.8 L 83 51.5 C 82 48 79 44 77 40 Z" fill="#F7B02B" opacity="0.25"/>
    <!-- Delicate curl at the corner of the mouth -->
    <circle cx="79.5" cy="56.2" r="1" fill="#F7B02B"/>
  </g>
</svg>
