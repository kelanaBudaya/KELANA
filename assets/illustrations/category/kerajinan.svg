<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <g id="backdrop">
    <circle cx="60" cy="60" r="54" fill="#D8DCF3"/>
    <circle cx="60" cy="60" r="46" fill="#5F6BC2" opacity="0.1"/>
  </g>

  <g id="batik-cloth">
    <!-- Drop shadow under cloth -->
    <rect x="20" y="34" width="76" height="68" rx="6" fill="#2F3A8F" opacity="0.18"/>
    <!-- Folded under-layer of cloth -->
    <rect x="15" y="33" width="74" height="66" rx="5" fill="#E7E0D4"/>
    <!-- Main mori cloth sheet -->
    <rect x="18" y="30" width="76" height="68" rx="6" fill="#FBF8F3"/>
    <!-- Subtle inner border frame on cloth -->
    <rect x="22" y="34" width="68" height="60" rx="3" stroke="#E7E0D4" stroke-width="1.5"/>
    <!-- Soft shaded corner fold -->
    <path d="M 80 30 L 94 44 L 84 44 C 81.8 44 80 42.2 80 40 Z" fill="#F4EFE7"/>
  </g>

  <g id="kawung-pattern">
    <!-- Subtle geometric grid lines on cloth -->
    <line x1="22" y1="64" x2="90" y2="64" stroke="#E7E0D4" stroke-width="1"/>
    <line x1="56" y1="34" x2="56" y2="94" stroke="#E7E0D4" stroke-width="1"/>

    <!-- Motif 1: Top-Left (Complete 4-petal Kawung) Center (39, 49) -->
    <g id="kawung-top-left">
      <!-- Top-Left Petal -->
      <path d="M 38 48 C 38 41, 31 40, 29 40 C 29 42, 30 48, 38 48 Z" fill="#2F3A8F"/>
      <circle cx="33" cy="43.5" r="1.1" fill="#FBF8F3"/>
      <!-- Top-Right Petal -->
      <path d="M 40 48 C 40 41, 47 40, 49 40 C 49 42, 48 48, 40 48 Z" fill="#2F3A8F"/>
      <circle cx="45" cy="43.5" r="1.1" fill="#FBF8F3"/>
      <!-- Bottom-Left Petal -->
      <path d="M 38 50 C 38 57, 31 58, 29 58 C 29 56, 30 50, 38 50 Z" fill="#2F3A8F"/>
      <circle cx="33" cy="54.5" r="1.1" fill="#FBF8F3"/>
      <!-- Bottom-Right Petal (Green Accent) -->
      <path d="M 40 50 C 40 57, 47 58, 49 58 C 49 56, 48 50, 40 50 Z" fill="#1F9D63"/>
      <circle cx="45" cy="54.5" r="1.1" fill="#FBF8F3"/>
      <!-- Center Diamond -->
      <polygon points="39,46.8 41.2,49 39,51.2 36.8,49" fill="#F7B02B"/>
    </g>

    <!-- Motif 2: Bottom-Left (Complete 4-petal Kawung) Center (39, 79) -->
    <g id="kawung-bottom-left">
      <!-- Top-Left Petal -->
      <path d="M 38 78 C 38 71, 31 70, 29 70 C 29 72, 30 78, 38 78 Z" fill="#2F3A8F"/>
      <circle cx="33" cy="73.5" r="1.1" fill="#FBF8F3"/>
      <!-- Top-Right Petal -->
      <path d="M 40 78 C 40 71, 47 70, 49 70 C 49 72, 48 78, 40 78 Z" fill="#2F3A8F"/>
      <circle cx="45" cy="73.5" r="1.1" fill="#FBF8F3"/>
      <!-- Bottom-Left Petal -->
      <path d="M 38 80 C 38 87, 31 88, 29 88 C 29 86, 30 80, 38 80 Z" fill="#2F3A8F"/>
      <circle cx="33" cy="84.5" r="1.1" fill="#FBF8F3"/>
      <!-- Bottom-Right Petal -->
      <path d="M 40 80 C 40 87, 47 88, 49 88 C 49 86, 48 80, 40 80 Z" fill="#2F3A8F"/>
      <circle cx="45" cy="84.5" r="1.1" fill="#FBF8F3"/>
      <!-- Center Diamond -->
      <polygon points="39,76.8 41.2,79 39,81.2 36.8,79" fill="#F7B02B"/>
    </g>

    <!-- Motif 3: Bottom-Right (Partially drawn Kawung - actively being waxed!) Center (73, 79) -->
    <g id="kawung-bottom-right-partial">
      <!-- Faint pencil/sketch guide for the un-waxed bottom petals -->
      <path d="M 72 80 C 72 87, 65 88, 63 88 C 63 86, 64 80, 72 80 Z" stroke="#DDBBA2" stroke-width="1.2"/>
      <path d="M 74 80 C 74 87, 81 88, 83 88 C 83 86, 82 80, 74 80 Z" stroke="#DDBBA2" stroke-width="1.2"/>
      <!-- Completed Bottom-Left Petal in Indigo -->
      <path d="M 72 80 C 72 87, 65 88, 63 88 C 63 86, 64 80, 72 80 Z" fill="#5F6BC2"/>
      <circle cx="67" cy="84.5" r="1.1" fill="#FBF8F3"/>
      <!-- Completed Top-Left Petal in Indigo -->
      <path d="M 72 78 C 72 71, 65 70, 63 70 C 63 72, 64 78, 72 78 Z" fill="#2F3A8F"/>
      <circle cx="67" cy="73.5" r="1.1" fill="#FBF8F3"/>
      <!-- Top-Right Petal: Fresh golden-brown molten wax trail being drawn right now -->
      <path d="M 74 78 C 74 71, 81 70, 83 70 C 83 72, 82 78, 74 78 Z" fill="#FDD98A" opacity="0.45"/>
      <path d="M 74 78 C 74 71.5, 80.5 70.2, 83 70 C 82.8 71.8, 82.2 74.5, 79 76.5" stroke="#F7B02B" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Center Diamond -->
      <polygon points="73,76.8 75.2,79 73,81.2 70.8,79" fill="#F7B02B"/>
    </g>

    <!-- Motif 4: Top-Right (Faint sketched Kawung awaiting wax) Center (73, 49) -->
    <g id="kawung-top-right-sketch">
      <path d="M 72 48 C 72 41, 65 40, 63 40 C 63 42, 64 48, 72 48 Z" fill="#D8DCF3" opacity="0.65"/>
      <path d="M 74 48 C 74 41, 81 40, 83 40 C 83 42, 82 48, 74 48 Z" stroke="#D8DCF3" stroke-width="1.5"/>
      <path d="M 72 50 C 72 57, 65 58, 63 58 C 63 56, 64 50, 72 50 Z" fill="#D8DCF3" opacity="0.65"/>
      <path d="M 74 50 C 74 57, 81 58, 83 58 C 83 56, 82 50, 74 50 Z" stroke="#D8DCF3" stroke-width="1.5"/>
      <polygon points="73,47.2 74.8,49 73,50.8 71.2,49" fill="#5F6BC2" opacity="0.5"/>
    </g>

    <!-- Intersection accent dots (Cecek) -->
    <circle cx="56" cy="49" r="1.8" fill="#2F3A8F"/>
    <circle cx="56" cy="79" r="1.8" fill="#2F3A8F"/>
    <circle cx="39" cy="64" r="1.8" fill="#2F3A8F"/>
    <circle cx="73" cy="64" r="1.8" fill="#5F6BC2" opacity="0.5"/>
    <polygon points="56,61 59,64 56,67 53,64" fill="#1F9D63"/>
  </g>

  <g id="canting-shadow" opacity="0.16">
    <!-- Cast shadow of canting on cloth -->
    <path d="M 60 66 C 54 68, 52 57, 57 52 L 69 40 C 72 43, 75 47, 74 53 C 73 59, 66 64, 60 66 Z" fill="#2F3A8F"/>
    <path d="M 72 44 L 104 20 L 108 26 L 76 50 Z" fill="#2F3A8F"/>
  </g>

  <g id="canting-tool">
    <!-- Curved copper spout (Carat) pouring wax onto the motif at (74, 70) -->
    <path d="M 60 56 C 60 64, 66 69, 73.5 69.8 C 74.5 70, 75 68.5, 74 68 C 68.5 67, 64 62.5, 64 55 Z" fill="#F7B02B"/>
    <path d="M 61.5 56.5 C 61.5 63, 66.8 67.5, 73.5 68.5" stroke="#FFF7E5" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Glowing drop of hot malam (wax) at the tip of the spout -->
    <circle cx="74" cy="69.5" r="2.2" fill="#F7B02B"/>
    <circle cx="74" cy="69.5" r="1.1" fill="#FFF7E5"/>

    <!-- Twin copper wire stem (Gagang Carat) connecting bowl to wooden handle -->
    <path d="M 73 41 L 81 33 L 84 37 L 76 45 Z" fill="#C99673"/>
    <path d="M 74 42.5 L 82 34.5" stroke="#FDD98A" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Copper wax reservoir bowl (Nyamplung) in Kunyit Gold -->
    <!-- Main rounded body of the copper bowl, tilted diagonally -->
    <path d="M 55 47 C 52 52, 54 59, 60 62 C 67 65, 75 60, 78 52 C 80 46, 78 41, 74 39 L 55 47 Z" fill="#F7B02B"/>
    <!-- Deeper golden-sogan shading along the bottom belly of the copper bowl -->
    <path d="M 55.5 55 C 57.5 60, 62 63, 68 61.5 C 73.5 60, 77.5 55, 78.3 49.5 C 74 55, 64 58, 55.5 55 Z" fill="#975A33" opacity="0.28"/>
    <!-- Bright specular highlight along the upper curve of the bowl -->
    <path d="M 57 49.5 C 61 47, 68 44, 74 43 C 72 47, 65 51, 57 49.5 Z" fill="#FDD98A"/>
    <!-- Elliptical top opening rim of the copper bowl -->
    <ellipse cx="64.5" cy="43" rx="11.5" ry="5" transform="rotate(-23 64.5 43)" fill="#FDD98A"/>
    <!-- Dark warm molten wax pool inside the bowl opening -->
    <ellipse cx="64.5" cy="43.3" rx="9.2" ry="3.6" transform="rotate(-23 64.5 43.3)" fill="#975A33"/>
    <!-- Hot golden liquid wax surface gleam inside the bowl -->
    <ellipse cx="63.8" cy="43.6" rx="6.5" ry="2.2" transform="rotate(-23 63.8 43.6)" fill="#F7B02B"/>
    <ellipse cx="62.5" cy="43.5" rx="3" ry="1" transform="rotate(-23 62.5 43.5)" fill="#FFF7E5"/>

    <!-- Metal ferrule collar (ring) where stem meets bamboo handle -->
    <path d="M 78 31.5 L 82.5 27.5 L 87 33 L 82.5 37 Z" fill="#F7B02B"/>
    <path d="M 79 32.5 L 83.5 28.5 L 85 30.2 L 80.5 34.2 Z" fill="#FDD98A"/>

    <!-- Bamboo / Wooden Handle (Gagang) in Sogan Brown extending to top-right -->
    <path d="M 81.5 28.5 L 103 10.5 C 105.5 8.5, 109 9.5, 110.8 11.8 C 112.6 14, 112.5 17.5, 109.8 19.8 L 86 34.2 Z" fill="#975A33"/>
    <!-- Warm top highlight along the cylindrical wooden handle -->
    <path d="M 82.5 29.5 L 104 11.5 C 105.8 10, 108 10.5, 109 11.8 L 84.2 31.5 Z" fill="#C99673"/>
    <path d="M 83.2 30.2 L 104.5 12.4" stroke="#DDBBA2" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Decorative bamboo node rings on the handle -->
    <path d="M 91.5 20.2 C 93.5 21.8, 95.2 24, 96 26.8" stroke="#DDBBA2" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 93 19 C 95 20.6, 96.7 22.8, 97.5 25.6" stroke="#171512" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
    <!-- Rounded butt-end cap of the wooden handle -->
    <ellipse cx="107.2" cy="14.8" rx="4.8" ry="2.6" transform="rotate(52 107.2 14.8)" fill="#C99673"/>
  </g>
</svg>
