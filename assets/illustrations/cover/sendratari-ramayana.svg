      <path d="M246 78 L249 85 L253 98 L258 95 L256 114 L263 111 L261 132 L268 129 L266 150 L272 150 L272 176 L220 176 L220 150 L226 150 L224 129 L231 132 L229 111 L236 114 L234 95 L239 98 L243 85 Z" fill="#F7B02B"/>
