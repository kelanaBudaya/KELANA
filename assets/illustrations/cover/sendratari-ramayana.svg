      <rect x="153" y="122" width="54" height="3" fill="#2F3A8F" opacity="0.55"/>
      <rect x="160" y="99" width="40" height="2.5" fill="#2F3A8F" opacity="0.55"/>
      <rect x="166" y="79" width="28" height="2" fill="#2F3A8F" opacity="0.55"/>
