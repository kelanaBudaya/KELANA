    <rect x="222" y="141" width="7" height="3.5" transform="rotate(-20 222 141)" fill="#F7B02B"/>

    <!-- Hanoman Costume: Poleng Checkered Accent & Gold/Red Kain Apron -->
    <polygon points="234,114 257,114 265,134 244,139 226,132" fill="#171512"/>
    <polygon points="237,114 254,114 259,131 244,135 232,129" fill="#F7B02B"/>
    <!-- Red Center Sash Tail -->
