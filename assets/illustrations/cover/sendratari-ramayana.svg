    <polygon points="113,83 129,83 127,76 115,76" fill="#F7B02B"/>
    <polygon points="115,76 127,76 125,68 117,68" fill="#FDD98A"/>
    <polygon points="118,68 124,68 121,55" fill="#F7B02B"/>
    <!-- Backward-Curving Wayang Finial -->
    <path d="M114 81 C108 77 107 68 113 64 C112 70 114 74 117 76 Z" fill="#F7B02B"/>
    <!-- Red Gem & Ear Ornament (Sumping) -->
    <circle cx="122" cy="79" r="1.5" fill="#D6402F"/>
    <polygon points="114,83 109,79 111,88 115,87" fill="#FDD98A"/>

    <!-- Front Arm (Right Arm Extended Holding Golden Bow) -->
