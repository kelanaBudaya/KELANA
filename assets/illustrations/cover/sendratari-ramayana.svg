    <!-- Poleng Black & White Waist Check Detail -->
    <rect x="235" y="113" width="5" height="4" fill="#FBF8F3"/>
    <rect x="240" y="113" width="5" height="4" fill="#171512"/>
    <rect x="245" y="113" width="5" height="4" fill="#FBF8F3"/>
    <rect x="250" y="113" width="5" height="4" fill="#171512"/>

    <!-- Torso (White Fur #FBF8F3, Leaning Dynamically Into Leap) -->
