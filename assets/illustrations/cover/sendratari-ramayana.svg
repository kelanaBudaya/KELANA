      <polygon points="192,52 194,58 190,58" fill="#F7B02B"/>
      <polygon points="160,69 162,75 158,75" fill="#F7B02B"/>
      <polygon points="200,69 202,75 198,75" fill="#F7B02B"/>
      <polygon points="156,89 158,95 154,95" fill="#F7B02B"/>
      <polygon points="204,89 206,95 202,95" fill="#F7B02B"/>
      <polygon points="149,112 151,118 147,118" fill="#F7B02B"/>
      <polygon points="211,112 213,118 209,118" fill="#F7B02B"/>
