    <polygon points="179,102.5 172,99.5 173,106" fill="#F7B02B"/>
    <polygon points="116,107 111,105 112,109" fill="#D6402F"/>
  </g>

  <!-- FOREGROUND DANCER 2: HANOMAN (The White Monkey Warrior Mid-Leap, Right-Center) -->
