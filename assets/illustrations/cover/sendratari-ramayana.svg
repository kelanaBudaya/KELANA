    <polygon points="94,151 102,154 99,176 92,176" fill="#DDBBA2"/>
    <!-- Flat Foot Planted on Ground -->
    <polygon points="92,174 103,174 105,177 87,177" fill="#DDBBA2"/>
    <!-- Gold Anklet (Gelang Kaki) -->
    <rect x="91" y="170" width="9" height="3" fill="#F7B02B"/>

