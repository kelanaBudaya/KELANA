    <line x1="104" y1="93" x2="101" y2="86" stroke="#FDD98A" stroke-width="1.5"/>
    <line x1="108" y1="92" x2="106" y2="85" stroke="#FFF7E5" stroke-width="1.5"/>

    <!-- Torso (Skin #DDBBA2, Noble Upright Posture) -->
