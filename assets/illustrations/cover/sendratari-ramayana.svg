    <circle cx="152" cy="18" r="1.5" fill="#FDD98A"/>
    <circle cx="215" cy="28" r="1.2" fill="#FDD98A"/>
    <circle cx="258" cy="19" r="1.6" fill="#FDD98A"/>
    <circle cx="340" cy="25" r="1.2" fill="#FDD98A"/>
    <circle cx="94" cy="54" r="1.3" fill="#FDD98A"/>
    <circle cx="242" cy="56" r="1.1" fill="#FDD98A"/>

