    <path d="M126 176 Q130 172 134 176 Z" fill="#FFF7E5"/>
    <path d="M176 176 Q180 172 184 176 Z" fill="#FFF7E5"/>
    <path d="M226 176 Q230 172 234 176 Z" fill="#FFF7E5"/>
    <path d="M278 176 Q282 172 286 176 Z" fill="#FFF7E5"/>

