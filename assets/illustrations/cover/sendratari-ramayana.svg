    <!-- Ornate Golden Bow Limbs -->
    <path d="M156 74 C166 84 166 96 159 105 C166 114 166 126 156 138" stroke="#F7B02B" stroke-width="2" fill="none"/>
    <circle cx="159" cy="105" r="2.5" fill="#D6402F"/>
