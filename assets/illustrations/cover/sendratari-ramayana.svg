    <!-- Front Arm (Left Arm Reaching Forward/Down in Classical Mudra) -->
    <polygon points="230,87 208,97 211,103 232,93" fill="#FBF8F3"/>
    <polygon points="208,97 195,86 199,82 212,96" fill="#FBF8F3"/>
    <!-- Expressive Dance Hand (Ngruji / Nyempurit) -->
    <polygon points="195,86 189,82 193,78 199,82" fill="#DDBBA2"/>
    <rect x="215" y="90" width="4" height="7" transform="rotate(-25 215 90)" fill="#F7B02B"/>
    <rect x="200" y="85" width="3.5" height="6" transform="rotate(40 200 85)" fill="#F7B02B"/>

    <!-- Back Arm (Right Arm Raised High Overhead) -->
    <polygon points="248,88 265,75 269,80 251,93" fill="#FBF8F3"/>
    <polygon points="265,75 258,57 264,55 270,77" fill="#FBF8F3"/>
    <polygon points="258,57 253,51 259,49 264,55" fill="#DDBBA2"/>
    <rect x="255" y="80" width="4" height="7" transform="rotate(-35 255 80)" fill="#F7B02B"/>
    <rect x="259" y="61" width="6" height="3.5" transform="rotate(-15 259 61)" fill="#F7B02B"/>

    <!-- Head (Stylized White Monkey Mask Profile, No Facial Features) -->
    <path d="M227 74 C227 68 242 68 242 75 L241 85 C241 87 226 87 226 84 Z" fill="#FBF8F3"/>
    <!-- Distinct Monkey Snout Silhouette Facing Left Toward Rama -->
