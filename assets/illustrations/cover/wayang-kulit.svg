<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" fill="none">
  <!-- Full-bleed background in Sogan brown -->
  <rect x="0" y="0" width="360" height="240" fill="#975A33"/>

  <!-- Background framing elements: night sky window, Merapi silhouette, clouds, and banyan foliage -->
  <g id="background-landscape">
    <!-- Subtle warm vignette behind the stage -->
    <rect x="18" y="10" width="324" height="190" rx="14" fill="#C99673" opacity="0.22"/>

    <!-- Distant Mount Merapi silhouette visible at the horizon flanks -->
    <polygon points="0,192 26,144 58,192" fill="#2F3A8F" opacity="0.45"/>
    <polygon points="302,192 334,148 360,192" fill="#2F3A8F" opacity="0.45"/>

    <!-- Stylized Javanese clouds (Mega Mendung inspired rounded shapes) - keeping top-left 80x40 calm -->
    <g id="clouds-right">
      <rect x="294" y="18" width="52" height="14" rx="7" fill="#DDBBA2" opacity="0.35"/>
      <rect x="308" y="12" width="30" height="12" rx="6" fill="#F8F1EC" opacity="0.3"/>
      <circle cx="304" cy="28" r="3" fill="#F7B02B" opacity="0.6"/>
    </g>

    <!-- Stylized indigo foliage (banyan/palm crowns) flanking the kelir frame -->
    <g id="foliage-left">
      <rect x="16" y="120" width="5" height="72" fill="#975A33"/>
      <ellipse cx="18" cy="116" rx="16" ry="12" fill="#2F3A8F"/>
      <ellipse cx="26" cy="104" rx="14" ry="10" fill="#5F6BC2"/>
      <ellipse cx="12" cy="100" rx="10" ry="8" fill="#D8DCF3" opacity="0.7"/>
    </g>
    <g id="foliage-right">
      <rect x="339" y="116" width="5" height="76" fill="#975A33"/>
      <ellipse cx="342" cy="112" rx="16" ry="12" fill="#2F3A8F"/>
      <ellipse cx="334" cy="100" rx="14" ry="10" fill="#5F6BC2"/>
      <ellipse cx="348" cy="96" rx="10" ry="8" fill="#D8DCF3" opacity="0.7"/>
    </g>
  </g>

  <!-- The Kelir (glowing Wayang Kulit shadow screen) -->
  <g id="kelir-screen">
    <!-- Outer carved wooden frame of the kelir -->
    <rect x="34" y="18" width="292" height="176" rx="12" fill="#171512"/>
    <!-- Indigo and Kunyit decorative frame border -->
    <rect x="38" y="22" width="284" height="168" rx="9" fill="#2F3A8F"/>
    <rect x="42" y="26" width="276" height="160" rx="7" fill="#F7B02B"/>
    <!-- Main glowing cloth screen in warm Kunyit pale gold -->
    <rect x="45" y="29" width="270" height="154" rx="5" fill="#FDD98A"/>

    <!-- Concentric warm light pools from the Blencong oil lamp at top centre -->
    <ellipse cx="180" cy="84" rx="116" ry="68" fill="#FFF7E5" opacity="0.38"/>
    <circle cx="180" cy="68" r="56" fill="#FFF7E5" opacity="0.75"/>
    <circle cx="180" cy="54" r="28" fill="#FFF7E5"/>

    <!-- Traditional red & indigo decorative border band along the top and sides of the cloth -->
    <rect x="45" y="29" width="270" height="5" fill="#D6402F"/>
    <rect x="45" y="177" width="270" height="6" fill="#D6402F"/>
    <!-- Geometric tumpal triangles along bottom screen border -->
    <polygon points="60,177 65,169 70,177" fill="#2F3A8F"/>
    <polygon points="80,177 85,169 90,177" fill="#2F3A8F"/>
    <polygon points="100,177 105,169 110,177" fill="#2F3A8F"/>
    <polygon points="120,177 125,169 130,177" fill="#2F3A8F"/>
    <polygon points="140,177 145,169 150,177" fill="#2F3A8F"/>
    <polygon points="210,177 215,169 220,177" fill="#2F3A8F"/>
    <polygon points="230,177 235,169 240,177" fill="#2F3A8F"/>
    <polygon points="250,177 255,169 260,177" fill="#2F3A8F"/>
    <polygon points="270,177 275,169 280,177" fill="#2F3A8F"/>
    <polygon points="290,177 295,169 300,177" fill="#2F3A8F"/>
  </g>

  <!-- Blencong (traditional hanging Javanese bronze oil lamp at top centre) -->
  <g id="blencong-lamp">
    <line x1="180" y1="18" x2="180" y2="34" stroke="#171512" stroke-width="2"/>
    <polygon points="168,34 192,34 186,41 174,41" fill="#171512"/>
    <!-- Garuda-wing shaped oil reservoir -->
    <path d="M164 41 C168 47 192 47 196 41 L191 38 L169 38 Z" fill="#F7B02B" stroke="#171512" stroke-width="1.2"/>
    <!-- Twin flames -->
    <path d="M180 43 C177 49 178 53 180 55 C182 53 183 49 180 43 Z" fill="#FFFFFF"/>
    <circle cx="180" cy="49" r="6" fill="#F7B02B" opacity="0.45"/>
  </g>

  <!-- Gunungan / Kayon (sacred leaf-shaped Tree-of-Life puppet in the exact centre, symmetric) -->
  <g id="gunungan-kayon">
    <!-- Central horn rod (cempurit) planted into the banana trunk -->
    <line x1="180" y1="164" x2="180" y2="186" stroke="#171512" stroke-width="2"/>
    <!-- Main pointed stupa/leaf silhouette of the Kayon -->
    <path d="M180 54 C194 74 214 98 212 132 C210 150 202 160 198 166 L162 166 C158 160 150 150 148 132 C146 98 166 74 180 54 Z" fill="#171512"/>

    <!-- Symmetric filigree cutouts revealing the glowing screen (#FFF7E5 / #FDD98A) and Kunyit/Indigo accents -->
    <!-- Top finial cutout -->
    <polygon points="180,62 185,72 180,77 175,72" fill="#FFF7E5"/>
    <circle cx="180" cy="83" r="3" fill="#F7B02B"/>

    <!-- Tree of life central trunk and branches (symmetric cutouts) -->
    <rect x="178.5" y="88" width="3" height="44" rx="1.5" fill="#FDD98A"/>
    <!-- Upper scrolling branches -->
    <path d="M180 94 C170 92 164 84 168 79 C172 76 175 82 173 85" stroke="#FFF7E5" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M180 94 C190 92 196 84 192 79 C188 76 185 82 187 85" stroke="#FFF7E5" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Middle scrolling branches -->
    <path d="M180 108 C166 106 156 98 160 91 C164 87 169 93 166 97" stroke="#FDD98A" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M180 108 C194 106 204 98 200 91 C196 87 191 93 194 97" stroke="#FDD98A" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Lower scrolling branches -->
    <path d="M180 122 C164 121 154 114 157 106 C160 101 166 107 163 111" stroke="#FDD98A" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M180 122 C196 121 206 114 203 106 C200 101 194 107 197 111" stroke="#FDD98A" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Symmetric flower/leaf perforations -->
    <circle cx="166" cy="83" r="2" fill="#FFF7E5"/>
    <circle cx="194" cy="83" r="2" fill="#FFF7E5"/>
    <circle cx="158" cy="96" r="2.2" fill="#FDD98A"/>
    <circle cx="202" cy="96" r="2.2" fill="#FDD98A"/>
    <circle cx="155" cy="112" r="2.2" fill="#FDD98A"/>
    <circle cx="205" cy="112" r="2.2" fill="#FDD98A"/>
    <circle cx="169" cy="101" r="1.8" fill="#F7B02B"/>
    <circle cx="191" cy="101" r="1.8" fill="#F7B02B"/>
    <circle cx="169" cy="115" r="1.8" fill="#F7B02B"/>
    <circle cx="191" cy="115" r="1.8" fill="#F7B02B"/>

    <!-- Kala-head / winged gate motif at the base of the Gunungan -->
    <polygon points="180,129 194,138 190,142 170,142 166,138" fill="#F7B02B"/>
    <polygon points="180,133 187,138 173,138" fill="#D6402F"/>
    <!-- Gate doorway and steps in screen cutout colour -->
    <rect x="173" y="145" width="14" height="14" rx="2" fill="#FDD98A"/>
    <rect x="176" y="148" width="8" height="11" fill="#171512"/>
    <circle cx="180" cy="153" r="2" fill="#FDD98A"/>
    <!-- Winged guardians (lar) on either side of the gate -->
    <path d="M168 148 L156 138 L159 152 Z" fill="#FDD98A"/>
    <path d="M192 148 L204 138 L201 152 Z" fill="#FDD98A"/>
    <!-- Base terrace perforations -->
    <rect x="165" y="161" width="30" height="2.5" rx="1" fill="#FDD98A"/>
    <circle cx="160" cy="158" r="1.8" fill="#FDD98A"/>
    <circle cx="200" cy="158" r="1.8" fill="#FDD98A"/>
  </g>

  <!-- Left Wayang Kulit Puppet (Alus / Noble Prince e.g., Arjuna, facing right in profile) -->
  <g id="wayang-puppet-left">
    <!-- Central body support rod -->
    <line x1="104" y1="162" x2="104" y2="186" stroke="#171512" stroke-width="2"/>

    <!-- Ornate Dodot/Kain skirt & trailing train -->
    <path d="M98 118 L112 118 L124 148 C126 155 120 162 114 162 L82 162 C76 160 74 150 82 142 L94 128 Z" fill="#171512"/>
    <!-- Feet planted on the screen bottom line -->
    <path d="M88 162 L88 175 L97 175 L94 172 L92 162 Z" fill="#171512"/>
    <path d="M108 162 L112 175 L121 175 L118 172 L113 162 Z" fill="#171512"/>

    <!-- Slender torso and broad ornate shoulders (slendang & praba wing) -->
    <path d="M92 90 L118 88 L111 118 L99 118 Z" fill="#171512"/>
    <!-- Back wing / Praba ornament -->
    <path d="M94 90 C82 82 78 66 86 58 C90 66 90 78 97 88 Z" fill="#171512"/>
    <!-- Kris hilt protruding at the back waist -->
    <path d="M96 114 L84 106 L82 109 L94 118 Z" fill="#171512"/>

    <!-- Thin neck angled slightly forward in noble posture -->
    <polygon points="103,82 109,82 108,90 101,90" fill="#171512"/>

    <!-- Head in profile with long pointed wayang nose and downward gaze, plus tall curved Supit Urang headdress -->
    <path d="M102 82
             L115 83
             L113 80
             L117 79
             L114 76
             L127 72
             L113 69
             C114 63 111 58 106 56
             C109 46 101 38 92 42
             C84 46 86 58 94 63
             C90 66 91 75 98 80 Z" fill="#171512"/>

    <!-- Inner curve cutout of the Supit Urang lobster-claw crown showing screen colour -->
    <path d="M98 58 C92 54 91 47 96 45 C101 43 104 49 102 56 Z" fill="#FDD98A"/>
    <!-- Crown gold diadem & sumping ear ornament -->
    <path d="M102 62 L112 66 L109 70 L100 66 Z" fill="#F7B02B"/>
    <!-- Almond wayang eye and crown details -->
    <circle cx="111" cy="72" r="1.4" fill="#FDD98A"/>
    <circle cx="96" cy="64" r="1.6" fill="#FDD98A"/>
    <circle cx="85" cy="70" r="1.6" fill="#FDD98A"/>
    <circle cx="87" cy="77" r="1.6" fill="#FDD98A"/>

    <!-- Gold collar (kalung) and waist belt (pending) -->
    <path d="M96 90 C102 96 110 96 115 89 L112 98 C106 101 100 100 96 95 Z" fill="#F7B02B"/>
    <rect x="98" y="115" width="14" height="4" rx="1.5" fill="#F7B02B"/>

    <!-- Skirt cut-out holes (tatahan filigree) showing the glowing screen colour #FDD98A -->
    <circle cx="105" cy="126" r="2" fill="#FDD98A"/>
    <circle cx="100" cy="133" r="1.8" fill="#FDD98A"/>
    <circle cx="106" cy="135" r="2.2" fill="#FDD98A"/>
    <circle cx="112" cy="133" r="1.8" fill="#FDD98A"/>
    <circle cx="94" cy="142" r="2" fill="#FDD98A"/>
    <circle cx="101" cy="144" r="2.2" fill="#FDD98A"/>
    <circle cx="109" cy="144" r="2.2" fill="#FDD98A"/>
    <circle cx="116" cy="142" r="2" fill="#FDD98A"/>
    <circle cx="87" cy="152" r="2" fill="#FDD98A"/>
    <circle cx="95" cy="153" r="2.4" fill="#FDD98A"/>
    <circle cx="104" cy="154" r="2.4" fill="#FDD98A"/>
    <circle cx="112" cy="153" r="2.4" fill="#FDD98A"/>
    <circle cx="119" cy="152" r="1.8" fill="#FDD98A"/>
    <path d="M84 158 L116 158" stroke="#FDD98A" stroke-width="1.5" stroke-dasharray="2 3"/>

    <!-- Very thin long jointed arms with elbow pins and control rods (tuding) -->
    <!-- Rear arm (bent downward at side) -->
    <line x1="93" y1="90" x2="78" y2="114" stroke="#171512" stroke-width="2" stroke-linecap="round"/>
    <line x1="78" y1="114" x2="86" y2="136" stroke="#171512" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="93" cy="90" r="1.5" fill="#FDD98A"/>
    <circle cx="78" cy="114" r="1.5" fill="#FDD98A"/>
    <!-- Rear hand and control rod -->
    <polygon points="86,136 91,139 85,142" fill="#171512"/>
    <line x1="88" y1="139" x2="80" y2="184" stroke="#171512" stroke-width="1.1"/>

    <!-- Front arm (extended forward in dramatic gesture toward the centre) -->
    <line x1="117" y1="89" x2="124" y2="113" stroke="#171512" stroke-width="2" stroke-linecap="round"/>
    <line x1="124" y1="113" x2="142" y2="100" stroke="#171512" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="117" cy="89" r="1.5" fill="#FDD98A"/>
    <circle cx="124" cy="113" r="1.5" fill="#FDD98A"/>
    <!-- Articulate wayang hand with curved fingers -->
    <path d="M142 100 L149 96 L147 101 L150 103 L143 103 Z" fill="#171512"/>
    <!-- Front control rod reaching down to the banana trunk -->
    <line x1="146" y1="101" x2="136" y2="184" stroke="#171512" stroke-width="1.1"/>
  </g>

  <!-- Right Wayang Kulit Puppet (Gagah / Kingly Character e.g., Werkudara/Gatotkaca, facing left in profile) -->
  <g id="wayang-puppet-right">
    <!-- Central body support rod -->
    <line x1="256" y1="162" x2="256" y2="186" stroke="#171512" stroke-width="2"/>

    <!-- Ornate Dodot/Kain skirt with wide stance -->
    <path d="M246 116 L264 116 L280 144 C286 152 282 162 274 162 L240 162 C234 162 230 154 234 146 Z" fill="#171512"/>
    <!-- Feet planted firmly on the screen bottom line -->
    <path d="M244 162 L239 175 L230 175 L233 172 L239 162 Z" fill="#171512"/>
    <path d="M268 162 L272 175 L263 175 L265 172 L263 162 Z" fill="#171512"/>

    <!-- Broad muscular torso and high winged Praba shoulders -->
    <path d="M240 86 L270 88 L263 116 L247 116 Z" fill="#171512"/>
    <!-- Tall carved Praba back-wing ornament -->
    <path d="M266 88 C278 78 284 60 274 50 C269 60 270 74 261 86 Z" fill="#171512"/>
    <!-- Kris hilt at back waist -->
    <path d="M263 112 L276 104 L278 107 L265 116 Z" fill="#171512"/>

    <!-- Neck -->
    <polygon points="250,79 257,79 258,88 249,88" fill="#171512"/>

    <!-- Head in profile facing left: long pointed nose, fierce mustache curve, tall Gelung Mahkota headdress -->
    <path d="M256 79
             L243 81
             L245 77
             L240 76
             L244 73
             L230 68
             L245 66
             C244 60 247 54 252 52
             C248 40 258 33 268 38
             C276 42 274 56 265 61
             C269 65 268 74 260 79 Z" fill="#171512"/>

    <!-- Inner cutout of the curved crown -->
    <path d="M261 55 C267 51 268 43 263 41 C258 39 254 46 257 53 Z" fill="#FDD98A"/>
    <!-- Crown gold diadem & sumping -->
    <path d="M257 59 L246 63 L249 68 L259 64 Z" fill="#F7B02B"/>
    <!-- Eye and crown filigree cutouts -->
    <circle cx="247" cy="69" r="1.5" fill="#FDD98A"/>
    <circle cx="263" cy="62" r="1.6" fill="#FDD98A"/>
    <circle cx="275" cy="64" r="1.6" fill="#FDD98A"/>
    <circle cx="273" cy="72" r="1.6" fill="#FDD98A"/>

    <!-- Gold collar & belt accent -->
    <path d="M243 87 C249 94 258 94 264 88 L261 97 C255 100 248 99 243 93 Z" fill="#F7B02B"/>
    <rect x="246" y="113" width="18" height="4" rx="1.5" fill="#F7B02B"/>

    <!-- Skirt cut-out holes (tatahan filigree) showing the glowing screen colour #FDD98A -->
    <circle cx="255" cy="124" r="2" fill="#FDD98A"/>
    <circle cx="249" cy="131" r="1.8" fill="#FDD98A"/>
    <circle cx="256" cy="133" r="2.2" fill="#FDD98A"/>
    <circle cx="263" cy="131" r="1.8" fill="#FDD98A"/>
    <circle cx="243" cy="141" r="2" fill="#FDD98A"/>
    <circle cx="251" cy="143" r="2.2" fill="#FDD98A"/>
    <circle cx="259" cy="143" r="2.2" fill="#FDD98A"/>
    <circle cx="267" cy="141" r="2" fill="#FDD98A"/>
    <circle cx="238" cy="151" r="1.8" fill="#FDD98A"/>
    <circle cx="246" cy="153" r="2.4" fill="#FDD98A"/>
    <circle cx="255" cy="154" r="2.4" fill="#FDD98A"/>
    <circle cx="264" cy="153" r="2.4" fill="#FDD98A"/>
    <circle cx="273" cy="151" r="2" fill="#FDD98A"/>
    <path d="M240 158 L274 158" stroke="#FDD98A" stroke-width="1.5" stroke-dasharray="2 3"/>

    <!-- Very thin long jointed arms with elbow pins and control rods -->
    <!-- Rear arm -->
    <line x1="268" y1="88" x2="282" y2="112" stroke="#171512" stroke-width="2" stroke-linecap="round"/>
    <line x1="282" y1="112" x2="274" y2="135" stroke="#171512" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="268" cy="88" r="1.5" fill="#FDD98A"/>
    <circle cx="282" cy="112" r="1.5" fill="#FDD98A"/>
    <polygon points="274,135 269,138 275,141" fill="#171512"/>
    <line x1="272" y1="138" x2="280" y2="184" stroke="#171512" stroke-width="1.1"/>

    <!-- Front arm (raised toward the centre) -->
    <line x1="241" y1="87" x2="234" y2="111" stroke="#171512" stroke-width="2" stroke-linecap="round"/>
    <line x1="234" y1="111" x2="217" y2="96" stroke="#171512" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="241" cy="87" r="1.5" fill="#FDD98A"/>
    <circle cx="234" cy="111" r="1.5" fill="#FDD98A"/>
    <path d="M217 96 L210 92 L212 97 L209 99 L216 99 Z" fill="#171512"/>
    <line x1="213" y1="97" x2="224" y2="184" stroke="#171512" stroke-width="1.1"/>
  </g>

  <!-- Foreground: Banana-trunk rail (gedebog), Dalang silhouette from behind, and Gamelan gongs -->
  <!-- Note: Bottom 48px band (y=192..240) kept visually calm for text overlay -->
  <g id="foreground-dalang-and-gamelan">
    <!-- Banana-trunk rail (gedebog) running across the base of the screen -->
    <rect x="24" y="182" width="312" height="12" rx="6" fill="#171512"/>
    <!-- Subtle kunyit and indigo trim along the banana trunk -->
    <line x1="36" y1="185" x2="324" y2="185" stroke="#975A33" stroke-width="1.5"/>
    <circle cx="52" cy="188" r="2" fill="#F7B02B"/>
    <circle cx="308" cy="188" r="2" fill="#F7B02B"/>

    <!-- Ground / stage floor band (y=190..240) in calm dark silhouette -->
    <rect x="0" y="190" width="360" height="50" fill="#171512"/>
    <!-- Subtle warm horizon line separating the rail from the calm bottom band -->
    <line x1="0" y1="192" x2="360" y2="192" stroke="#2F3A8F" stroke-width="1.5" opacity="0.7"/>

    <!-- Left Gamelan Gong stand and hanging Kempul/Gong silhouette -->
    <g id="gamelan-left">
      <!-- Carved wooden gayor stand -->
      <rect x="38" y="152" width="4" height="40" fill="#171512"/>
      <rect x="78" y="152" width="4" height="40" fill="#171512"/>
      <path d="M32 154 C42 146 78 146 88 154 L85 158 L35 158 Z" fill="#171512"/>
      <!-- Hanging cords -->
      <line x1="52" y1="157" x2="56" y2="165" stroke="#171512" stroke-width="1.5"/>
      <line x1="68" y1="157" x2="64" y2="165" stroke="#171512" stroke-width="1.5"/>
      <!-- Gong silhouette with Kunyit boss (pencu) -->
      <circle cx="60" cy="174" r="12" fill="#171512" stroke="#975A33" stroke-width="1"/>
      <circle cx="60" cy="174" r="4" fill="#F7B02B"/>
    </g>

    <!-- Right Gamelan Gong stand with two hanging gongs (Gong Ageng & Suwukan) -->
    <g id="gamelan-right">
      <!-- Carved wooden gayor stand -->
      <rect x="268" y="148" width="4" height="44" fill="#171512"/>
      <rect x="322" y="148" width="4" height="44" fill="#171512"/>
      <path d="M262 150 C276 141 318 141 332 150 L329 155 L265 155 Z" fill="#171512"/>
      <!-- Hanging Gong 1 (smaller) -->
      <line x1="283" y1="154" x2="283" y2="163" stroke="#171512" stroke-width="1.5"/>
      <circle cx="283" cy="171" r="9" fill="#171512" stroke="#975A33" stroke-width="1"/>
      <circle cx="283" cy="171" r="3" fill="#F7B02B"/>
      <!-- Hanging Gong 2 (larger Gong Ageng) -->
      <line x1="307" y1="154" x2="307" y2="161" stroke="#171512" stroke-width="1.5"/>
      <circle cx="307" cy="172" r="13" fill="#171512" stroke="#975A33" stroke-width="1"/>
      <circle cx="307" cy="172" r="4.5" fill="#F7B02B"/>
    </g>

    <!-- The Dalang (puppet master) seen from behind at bottom centre, wearing a Javanese Blangkon -->
    <g id="dalang-silhouette">
      <!-- Broad calm shoulders and Surjan jacket silhouette -->
      <path d="M142 240 L146 206 C148 194 160 188 180 188 C200 188 212 194 214 206 L218 240 Z" fill="#171512"/>
      <!-- Subtle indigo collar stripe on the Dalang's traditional Surjan jacket -->
      <path d="M162 190 C170 194 190 194 198 190" stroke="#2F3A8F" stroke-width="2" stroke-linecap="round"/>
      <!-- Head and neck from behind -->
      <rect x="173" y="180" width="14" height="10" fill="#171512"/>
      <!-- Traditional Javanese Blangkon headwear with characteristic Mondolan bun at the back -->
      <path d="M167 174 C167 162 193 162 193 174 L191 182 L169 182 Z" fill="#171512"/>
      <!-- Blangkon batik band and mondolan (back knot) -->
      <path d="M167 175 L193 175" stroke="#F7B02B" stroke-width="1.5"/>
      <circle cx="180" cy="176" r="5" fill="#2F3A8F" stroke="#171512" stroke-width="1.5"/>
      <circle cx="180" cy="176" r="1.8" fill="#F7B02B"/>
    </g>
  </g>
</svg>
