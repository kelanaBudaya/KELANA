    <rect x="30" y="271" width="100" height="5" rx="1" fill="#2F3A8F" />
    <rect x="38" y="267" width="84" height="1.5" fill="#F7B02B" />
    <!-- Center Stairs -->
    <rect x="68" y="266" width="24" height="5" fill="#DDBBA2" />
    <rect x="65" y="271" width="30" height="5" fill="#C99673" />

    <!-- JOGLO ROOF TIER 1: Wide, Shallow Lower Hip Roof (Penanggap) -->
    <polygon points="24,228 54,205 106,205 136,228" fill="#DDBBA2" />
    <!-- Right side subtle shading for dimension -->
    <polygon points="80,205 106,205 136,228 80,228" fill="#C99673" opacity="0.45" />
    <!-- Eave Gold & Sogan Trim -->
    <rect x="22" y="226" width="116" height="3" rx="1.5" fill="#975A33" />
