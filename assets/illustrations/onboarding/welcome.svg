    <circle cx="180" cy="158" r="118" fill="#FDD98A" />
    <circle cx="180" cy="158" r="92" fill="#FFF7E5" opacity="0.45" />

    <!-- Distant Mount Merapi Silhouette -->
    <path d="M82 276 L154 114 C159 104 167 104 172 114 L244 276 Z" fill="#D8DCF3" />
