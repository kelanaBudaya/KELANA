    <circle cx="30" cy="264" r="12" fill="#D9F2E4" />
    <circle cx="24" cy="267" r="9" fill="#1F9D63" />
    <rect x="23" y="268" width="2" height="8" fill="#975A33" />

    <!-- Left-Centre Tree (between Pendopo & Tugu) -->
    <circle cx="143" cy="250" r="15" fill="#D9F2E4" />
    <circle cx="137" cy="255" r="13" fill="#1F9D63" />
    <circle cx="148" cy="259" r="10" fill="#1F9D63" />
    <rect x="140" y="260" width="3" height="16" rx="1" fill="#975A33" />

    <!-- Right-Centre Tree (between Tugu & Prambanan) -->
