    <rect x="36" y="232" width="88" height="2" fill="#F7B02B" />

    <!-- Inner Saka Guru (4 Main Central Columns) & Outer Columns -->
    <!-- Outer Left Column -->
    <rect x="42" y="234" width="4" height="32" fill="#975A33" />
    <rect x="41" y="234" width="6" height="3" fill="#F7B02B" />
    <rect x="40" y="263" width="8" height="3" fill="#C99673" />

    <!-- Inner Left Saka Guru Column -->
    <rect x="61" y="234" width="5" height="32" fill="#975A33" />
    <rect x="60" y="234" width="7" height="4" fill="#F7B02B" />
    <rect x="60" y="238" width="7" height="2" fill="#D6402F" />
    <rect x="59" y="263" width="9" height="3" fill="#C99673" />

