      <rect x="295" y="182" width="3" height="4" fill="#D8DCF3" />
      <rect x="257" y="172" width="3" height="4" fill="#D8DCF3" />
      <rect x="292" y="172" width="3" height="4" fill="#D8DCF3" />
      <rect x="260" y="162" width="3" height="4" fill="#D8DCF3" />
      <rect x="289" y="162" width="3" height="4" fill="#D8DCF3" />
      <rect x="263" y="153" width="3" height="4" fill="#D8DCF3" />
      <rect x="286" y="153" width="3" height="4" fill="#D8DCF3" />
      <rect x="266" y="144" width="3" height="4" fill="#D8DCF3" />
      <rect x="283" y="144" width="3" height="4" fill="#D8DCF3" />
