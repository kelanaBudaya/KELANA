    <!-- Kawung 4: Top Right -->
    <g id="kawung-top-right">
      <ellipse cx="308" cy="60" rx="3" ry="5.5" fill="#F7B02B" opacity="0.7" />
      <ellipse cx="308" cy="74" rx="3" ry="5.5" fill="#F7B02B" opacity="0.7" />
      <ellipse cx="301" cy="67" rx="5.5" ry="3" fill="#F7B02B" opacity="0.7" />
