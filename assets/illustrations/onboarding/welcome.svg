      <ellipse cx="30" cy="170" rx="2.4" ry="4.4" fill="#DDBBA2" opacity="0.8" />
      <ellipse cx="25" cy="165" rx="4.4" ry="2.4" fill="#DDBBA2" opacity="0.8" />
      <ellipse cx="35" cy="165" rx="4.4" ry="2.4" fill="#DDBBA2" opacity="0.8" />
