    <line x1="69" y1="168" x2="54" y2="203" stroke="#C99673" stroke-width="1.5" />
    <line x1="91" y1="168" x2="106" y2="203" stroke="#C99673" stroke-width="1.5" />

    <!-- Roof Ridge Crown (Wuwungan) & Finials -->
    <rect x="66" y="165" width="28" height="4" rx="2" fill="#F7B02B" />
    <polygon points="66,167 62,163 66,165" fill="#F7B02B" />
    <polygon points="94,167 98,163 94,165" fill="#F7B02B" />
    <polygon points="80,157 84,165 76,165" fill="#F7B02B" />
    <circle cx="80" cy="156" r="2" fill="#D6402F" />
