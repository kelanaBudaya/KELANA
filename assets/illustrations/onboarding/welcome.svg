      <ellipse cx="226" cy="56" rx="2.6" ry="4.8" fill="#D8DCF3" />
      <ellipse cx="220" cy="50" rx="4.8" ry="2.6" fill="#D8DCF3" />
      <ellipse cx="232" cy="50" rx="4.8" ry="2.6" fill="#D8DCF3" />
      <circle cx="226" cy="50" r="1.6" fill="#5F6BC2" />
