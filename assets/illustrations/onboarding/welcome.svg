  <!-- CENTRE LANDMARK: Tugu Yogyakarta / Tugu Pal Putih (Exactly Symmetric at x=180) -->
  <g id="landmark-tugu-yogyakarta">
    <!-- Stepped Square Base Plinth -->
    <!-- Bottom Step -->
