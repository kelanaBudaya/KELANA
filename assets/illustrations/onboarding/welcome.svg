    <rect x="94" y="234" width="5" height="32" fill="#975A33" />
    <rect x="93" y="234" width="7" height="4" fill="#F7B02B" />
    <rect x="93" y="238" width="7" height="2" fill="#D6402F" />
    <rect x="92" y="263" width="9" height="3" fill="#C99673" />

    <!-- Outer Right Column -->
    <rect x="114" y="234" width="4" height="32" fill="#975A33" />
    <rect x="113" y="234" width="6" height="3" fill="#F7B02B" />
    <rect x="112" y="263" width="8" height="3" fill="#C99673" />

