    <path d="M266 106 H314 C318.4 106 322 102.4 322 98 C322 93.6 318.4 90 314 90 H305 C303 82 296 77 288 77 C279 77 271 84 271 93 H266 C261.6 93 258 96.6 258 101 C258 103.8 261.6 106 266 106 Z" fill="#FFF7E5" />
