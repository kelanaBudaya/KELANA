<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <g id="backdrop">
    <circle cx="60" cy="60" r="54" fill="#D8DCF3"/>
    <ellipse cx="60" cy="102" rx="38" ry="5" fill="#5F6BC2" opacity="0.28"/>
  </g>

  <g id="back-arms">
    <!-- Center friend arms reaching behind Left and Right friends' shoulders -->
    <path d="M49 46 H30 V54 H49 Z" fill="#F7B02B"/>
    <path d="M71 46 H90 V54 H71 Z" fill="#F7B02B"/>
  </g>

  <g id="friend-left">
    <!-- Waving left arm raised -->
    <path d="M26 53 C19 51 15 43 16 32 C16 29 21 29 21 32 C21 39 23 44 28 46 Z" fill="#2F3A8F"/>
    <circle cx="18.5" cy="29.5" r="3.5" fill="#975A33"/>

    <!-- Legs and trousers -->
    <rect x="27" y="72" width="6.5" height="26" rx="3" fill="#F4EFE7"/>
    <rect x="35.5" y="72" width="6.5" height="26" rx="3" fill="#F4EFE7"/>
    <!-- Shoes -->
    <path d="M25 97 H33.5 V101 H23.5 C23.5 98.8 24.2 97 25 97 Z" fill="#975A33"/>
    <path d="M35.5 97 H44 C44.8 97 45.5 98.8 45.5 101 H35.5 Z" fill="#975A33"/>

    <!-- Torso in Indigo (#2F3A8F) -->
    <path d="M25 47 C25 45.3 26.3 44 28 44 H41 C42.7 44 44 45.3 44 47 V74 H25 V47 Z" fill="#2F3A8F"/>
    <!-- Scarf / collar accent -->
    <path d="M30 44 H39 L37.5 50 H31.5 Z" fill="#FDD98A"/>
    <!-- Shirt stripe detail -->
    <rect x="25" y="67" width="19" height="4" fill="#5F6BC2"/>

    <!-- Neck and Head (Skin #975A33, no facial features) -->
    <rect x="32" y="39" width="5" height="7" rx="2.5" fill="#975A33"/>
    <circle cx="34.5" cy="33" r="8.5" fill="#975A33"/>

    <!-- Hair Shape 1: Short side-parted crop (#171512) -->
    <path d="M25.5 33 C25.5 26.5 29.5 22.5 35 22.5 C40.5 22.5 43.5 26 43.5 31 C40.5 29 36.5 28.5 32 30 C29.5 30.8 27.5 32.5 26 35 C25.7 34.3 25.5 33.7 25.5 33 Z" fill="#171512"/>
  </g>

  <g id="friend-right">
    <!-- Right arm resting on hip -->
    <path d="M93 46 C100 48 104 54 102 61 C101 64 97 65 95 63 L94 58 C96 57 97 55 96 53 C95 51 94 50 92 50 Z" fill="#975A33"/>
    <circle cx="95" cy="62" r="3" fill="#DDBBA2"/>

    <!-- Legs and trousers -->
    <rect x="78" y="72" width="6.5" height="26" rx="3" fill="#2F3A8F"/>
    <rect x="86.5" y="72" width="6.5" height="26" rx="3" fill="#2F3A8F"/>
    <!-- Cuffs -->
    <rect x="78" y="93" width="6.5" height="3" fill="#5F6BC2"/>
    <rect x="86.5" y="93" width="6.5" height="3" fill="#5F6BC2"/>
    <!-- Shoes -->
    <path d="M76.5 97 H84.5 V101 H75 C75 98.8 75.7 97 76.5 97 Z" fill="#FBF8F3"/>
    <path d="M86.5 97 H94.5 C95.3 97 96 98.8 96 101 H86.5 Z" fill="#FBF8F3"/>

    <!-- Hair Shape 3 Back: Rounded geometric bob (#171512) -->
    <rect x="76" y="25" width="19" height="21" rx="8" fill="#171512"/>

    <!-- Torso in Sogan Brown (#975A33) -->
    <path d="M76 47 C76 45.3 77.3 44 79 44 H92 C93.7 44 95 45.3 95 47 V74 H76 V47 Z" fill="#975A33"/>
    <!-- Geometric collar and strap detail -->
    <path d="M81 44 H90 L88.5 50 H82.5 Z" fill="#FBF8F3"/>
    <rect x="76" y="67" width="19" height="4" fill="#C99673"/>

    <!-- Neck and Head (Skin #DDBBA2, no facial features) -->
    <rect x="83" y="39" width="5" height="7" rx="2.5" fill="#C99673"/>
    <circle cx="85.5" cy="33" r="8.5" fill="#DDBBA2"/>

    <!-- Hair Shape 3 Front: Center-parted bangs -->
    <path d="M76.5 32 C76.5 26 80.5 23 85.5 23 C90.5 23 94.5 26 94.5 32 C91 31 88 28.5 85.5 26.5 C83 28.5 80 31 76.5 32 Z" fill="#171512"/>
  </g>

  <g id="friend-center">
    <!-- Legs and trousers -->
    <rect x="51.5" y="71" width="7" height="28" rx="3.2" fill="#171512"/>
    <rect x="61.5" y="71" width="7" height="28" rx="3.2" fill="#171512"/>
    <!-- Shoes -->
    <path d="M49.5 97 H58.5 V101 H48 C48 98.8 48.7 97 49.5 97 Z" fill="#F7B02B"/>
    <path d="M61.5 97 H70.5 C71.3 97 72 98.8 72 101 H61.5 Z" fill="#F7B02B"/>

    <!-- Torso in Kunyit Gold (#F7B02B) -->
    <path d="M48 45 C48 43.3 49.3 42 51 42 H69 C70.7 42 72 43.3 72 45 V73 H48 V45 Z" fill="#F7B02B"/>
    <!-- Subtle geometric shirt stripe -->
    <rect x="48" y="64" width="24" height="4" fill="#FDD98A"/>
    <!-- Crossbody camera strap and small camera -->
    <path d="M52 42 L68 65 L65 67 L49 44 Z" fill="#2F3A8F"/>
    <rect x="61" y="59" width="8" height="6" rx="1.5" fill="#171512"/>
    <circle cx="65" cy="62" r="2" fill="#FFFFFF"/>

    <!-- Neck and Head (Skin #DDBBA2, no facial features) -->
    <rect x="57.5" y="37" width="5" height="7" rx="2.5" fill="#C99673"/>
    <circle cx="60" cy="31" r="9" fill="#DDBBA2"/>

    <!-- Hair Shape 2: High top bun with curved hairline (#171512) -->
    <circle cx="60" cy="19" r="5" fill="#171512"/>
    <path d="M51 30 C51 24.5 55 21.5 60 21.5 C65 21.5 69 24.5 69 30 C66.5 27.5 63.5 26.5 60 26.5 C56.5 26.5 53.5 27.5 51 30 Z" fill="#171512"/>
  </g>

  <g id="embracing-hands">
    <!-- Center friend's hands clasping outer shoulders of Left and Right friends -->
    <rect x="23.5" y="45" width="5" height="6.5" rx="2.5" fill="#DDBBA2"/>
    <rect x="91.5" y="45" width="5" height="6.5" rx="2.5" fill="#DDBBA2"/>
  </g>
</svg>
