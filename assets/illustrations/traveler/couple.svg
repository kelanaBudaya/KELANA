<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <g id="backdrop">
    <circle cx="60" cy="60" r="54" fill="#FDD98A"/>
  </g>

  <g id="decorative-accents">
    <circle cx="24" cy="40" r="2.5" fill="#FFF7E5"/>
    <circle cx="96" cy="40" r="2.5" fill="#FFF7E5"/>
    <path d="M22 68 L25 65 L28 68 L25 71 Z" fill="#F7B02B"/>
    <path d="M92 68 L95 65 L98 68 L95 71 Z" fill="#F7B02B"/>
  </g>

  <g id="figure-left-long-hair">
    <!-- Back long hair -->
    <rect x="30" y="30" width="28" height="32" rx="12" fill="#171512"/>
    <circle cx="32" cy="48" r="5" fill="#171512"/>
    <circle cx="56" cy="48" r="5" fill="#171512"/>

    <!-- Legs / trousers (head-to-knees crop) -->
    <rect x="33" y="80" width="10" height="20" rx="4" fill="#2F3A8F"/>
    <rect x="45" y="80" width="10" height="20" rx="4" fill="#2F3A8F"/>
    <rect x="33" y="95" width="10" height="3" fill="#5F6BC2"/>
    <rect x="45" y="95" width="10" height="3" fill="#5F6BC2"/>

    <!-- Backpack straps hint behind shoulders -->
    <rect x="31" y="53" width="26" height="24" rx="8" fill="#975A33"/>

    <!-- Torso / Cream travel tunic & top -->
    <path d="M27 64 C27 56 33 52 44 52 C55 52 61 56 61 64 L59 84 C59 85.5 57.5 86 56 86 L32 86 C30.5 86 29 85.5 29 84 Z" fill="#FBF8F3"/>
    <!-- Subtle shadow on right side of left figure torso where overlapping -->
    <path d="M51 53 C57 54 61 58 61 64 L59 86 L51 86 Z" fill="#F4EFE7"/>

    <!-- Outer Sleeves -->
    <path d="M27 62 C25 66 25 74 26 79 L32 79 L33 62 Z" fill="#F4EFE7"/>
    <!-- Left Arm skin -->
    <rect x="26" y="78" width="5.5" height="9" rx="2.75" fill="#DDBBA2"/>

    <!-- Collar & Neck -->
    <path d="M38 52 L44 60 L50 52 Z" fill="#E7E0D4"/>
    <rect x="40.5" y="45" width="7" height="10" rx="3.5" fill="#DDBBA2"/>
    <path d="M40.5 49 C42.5 51 45.5 51 47.5 49 L47.5 52 L40.5 52 Z" fill="#C99673"/>

    <!-- Batik / Geometric hem trim on cream top -->
    <rect x="29.5" y="80" width="29" height="4" fill="#F7B02B"/>
    <circle cx="34" cy="82" r="1.2" fill="#2F3A8F"/>
    <circle cx="40.5" cy="82" r="1.2" fill="#2F3A8F"/>
    <circle cx="47" cy="82" r="1.2" fill="#2F3A8F"/>
    <circle cx="53.5" cy="82" r="1.2" fill="#2F3A8F"/>

    <!-- Crossbody satchel strap -->
    <path d="M35 53 L39 53 L56 79 L52 79 Z" fill="#975A33"/>
    <rect x="49" y="73" width="9" height="8" rx="2" fill="#975A33"/>
    <rect x="50.5" y="74.5" width="6" height="3" rx="1" fill="#C99673"/>

    <!-- Round Head (NO facial features) -->
    <circle cx="33.5" cy="39" r="2.5" fill="#DDBBA2"/>
    <circle cx="54.5" cy="39" r="2.5" fill="#DDBBA2"/>
    <circle cx="44" cy="38" r="10.5" fill="#DDBBA2"/>
    <!-- Side swept hair crown -->
    <path d="M33.5 38 C33.5 31 38 27 44 27 C50 27 54.5 31 54.5 38 C52 34 48 32.5 43 33 C38 33.5 35 35.5 33.5 38 Z" fill="#171512"/>
  </g>

  <g id="figure-right-short-hair">
    <!-- Legs / Cream trousers (head-to-knees crop) -->
    <rect x="65" y="80" width="10" height="20" rx="4" fill="#FBF8F3"/>
    <rect x="77" y="80" width="10" height="20" rx="4" fill="#FBF8F3"/>
    <rect x="65" y="95" width="10" height="3" fill="#E7E0D4"/>
    <rect x="77" y="95" width="10" height="3" fill="#E7E0D4"/>

    <!-- Torso / Indigo jacket & shirt (overlapping left figure shoulder slightly at x=57..61) -->
    <path d="M57 63 C57 55 64 51 76 51 C88 51 93 55 93 63 L91 84 C91 85.5 89.5 86 88 86 L62 86 C60.5 86 59 85.5 59 84 Z" fill="#2F3A8F"/>

    <!-- Cream inner tee & collar -->
    <path d="M70 51 L76 62 L82 51 Z" fill="#FBF8F3"/>
    <!-- Jacket center placket & lapel geometric accents -->
    <rect x="74.5" y="60" width="3" height="26" fill="#5F6BC2"/>
    <path d="M68 51 L73 61 L69 63 L65 53 Z" fill="#5F6BC2"/>
    <path d="M84 51 L79 61 L83 63 L87 53 Z" fill="#5F6BC2"/>

    <!-- Left overlapping shoulder & arm (embracing/close side by side) -->
    <path d="M57 61 C55.5 65 55.5 73 57 78 L63 78 L63 61 Z" fill="#5F6BC2"/>
    <!-- Right outer sleeve -->
    <path d="M93 61 C94.5 65 94.5 73 93 78 L87 78 L87 61 Z" fill="#5F6BC2"/>
    <!-- Right Arm skin -->
    <rect x="87.5" y="77" width="5.5" height="9" rx="2.75" fill="#975A33"/>
    <!-- Inner Arm skin (hands close together at center) -->
    <rect x="57" y="77" width="5.5" height="9" rx="2.75" fill="#975A33"/>

    <!-- Travel Camera on Kunyit Gold Strap -->
    <path d="M70 52 L72 52 L74 68 L72 68 Z" fill="#F7B02B"/>
    <path d="M82 52 L80 52 L78 68 L80 68 Z" fill="#F7B02B"/>
    <rect x="69.5" y="66" width="13" height="9" rx="2" fill="#FBF8F3"/>
    <rect x="69.5" y="68" width="13" height="5" fill="#171512"/>
    <circle cx="76" cy="70.5" r="3" fill="#5F6BC2"/>
    <circle cx="76" cy="70.5" r="1.4" fill="#D8DCF3"/>
    <rect x="79.5" y="64.8" width="2" height="1.2" rx="0.5" fill="#D6402F"/>

    <!-- Neck -->
    <rect x="72.5" y="44" width="7" height="10" rx="3.5" fill="#975A33"/>

    <!-- Round Head (NO facial features) -->
    <circle cx="65.5" cy="38" r="2.5" fill="#975A33"/>
    <circle cx="86.5" cy="38" r="2.5" fill="#975A33"/>
    <circle cx="76" cy="37" r="10.5" fill="#975A33"/>

    <!-- Short geometric hair cap -->
    <path d="M65.5 36 C65.5 29 70 25 76 25 C82 25 86.5 29 86.5 36 L85 36 C84 32 80.5 30.5 76 30.5 C71.5 30.5 68 32 67 36 Z" fill="#171512"/>
    <rect x="68" y="24.5" width="16" height="5" rx="2.5" fill="#171512"/>
  </g>

  <g id="heart-and-kunyit-accent">
    <!-- Subtle halo behind heart -->
    <circle cx="60" cy="22" r="8.5" fill="#FFF7E5"/>
    <!-- Bold red heart between/above the couple -->
    <path d="M60 27.5 C60 27.5 53 23 53 18.8 C53 16.5 54.8 15 56.8 15 C58.2 15 59.4 15.8 60 17 C60.6 15.8 61.8 15 63.2 15 C65.2 15 67 16.5 67 18.8 C67 23 60 27.5 60 27.5 Z" fill="#D6402F"/>
    <!-- Kunyit gold rays above heart -->
    <rect x="59.2" y="10" width="1.6" height="3" rx="0.8" fill="#F7B02B"/>
    <path d="M51 12.5 L53 14.5" stroke="#F7B02B" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M69 12.5 L67 14.5" stroke="#F7B02B" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
