*{box-sizing:border-box;margin:0;padding:0}
body{font:400 14px/20px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);background:#e9e3d8;min-height:100vh;display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#phone{width:360px;height:800px;background:var(--bg-canvas);position:relative;overflow:hidden;border-radius:32px;box-shadow:0 0 0 8px var(--n900),var(--e3)}
@media(max-width:420px){body{display:block}#phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.h-disp{font:600 28px/36px Fraunces,serif}.h-lg{font:600 24px/32px Fraunces,serif}.h-md{font:600 20px/28px Fraunces,serif}
.t-lg{font:700 18px/26px 'Plus Jakarta Sans'}.t-md{font:600 16px/24px 'Plus Jakarta Sans'}.t-sm{font:600 14px/20px 'Plus Jakarta Sans'}
.b-sm{font-size:12px;line-height:16px}.lbl{font:600 12px/16px 'Plus Jakarta Sans'}
.sec{color:var(--text-2)}.ter{color:var(--text-3)}
.btn{height:48px;padding:0 20px;border-radius:var(--r-xl);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
.btn:active{transform:scale(.97)}.btn.p{background:var(--bg-brand);color:#fff}.btn.s{background:var(--indigo-50);color:var(--indigo-600)}.btn.t{color:var(--indigo-600)}.btn.a{background:var(--bg-accent);color:var(--n900)}.btn.w{width:100%}.btn[disabled]{background:var(--n200);color:var(--n500);cursor:not-allowed}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}.ib.f{background:var(--bg-surface);box-shadow:var(--e2)}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--bg-surface);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--indigo-600);border-color:var(--indigo-600);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font:600 11px/16px 'Plus Jakarta Sans';white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.card{background:var(--bg-surface);border-radius:var(--r-lg);box-shadow:var(--e1);border:1px solid var(--border)}
.hero{background:var(--indigo-600) var(--kawung);color:#fff;position:relative}
.cover{position:relative;overflow:hidden;color:#fff;display:grid;place-items:center}
.cover::after{content:"";position:absolute;inset:0;background:var(--kawung);z-index:1}
.cover svg{width:44px;height:44px;stroke-width:1.5;position:relative;z-index:1;opacity:.9}
/* onboarding */
.onb{padding:0 16px 24px;display:flex;flex-direction:column;flex:1}
.prog{display:flex;gap:6px;padding:16px 0}.prog i{flex:1;height:4px;border-radius:2px;background:var(--n200)}.prog i.on{background:var(--indigo-600)}
.sel{border:2px solid var(--border);border-radius:var(--r-lg);background:var(--bg-surface);padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:112px}
.sel.on{border-color:var(--indigo-600);background:var(--indigo-50)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--bg-subtle);border-radius:var(--r-md);padding:12px 14px;margin-top:16px}
/* nav */
.nav{height:72px;background:var(--bg-surface);border-top:1px solid var(--border);display:flex;padding-bottom:8px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-3);font:600 11px/16px 'Plus Jakarta Sans'}
.nav button.on{color:var(--indigo-600)}.nav button.on .pill{background:var(--indigo-100)}
.nav .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
/* map */
.map{flex:1;position:relative;background:#F4EFE7;overflow:hidden}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);width:36px;height:44px;display:grid;place-items:start center;transition:transform .15s}
.pin i{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:var(--e2);border:2px solid #fff}

.mtop{position:absolute;top:0;left:0;right:0;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px;z-index:6}
.search{height:48px;border-radius:24px;background:var(--bg-surface);box-shadow:var(--e2);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--text-3)}
.search input{flex:1;border:0;outline:0;font:inherit;color:var(--text);background:none;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.mcard{position:absolute;left:12px;right:12px;bottom:12px;z-index:7;padding:10px;display:flex;gap:12px;box-shadow:var(--e3);text-align:left;width:calc(100% - 24px)}
.mcard .cover{width:84px;border-radius:var(--r-md);flex:none}
.mbtn{position:absolute;top:122px;left:50%;transform:translateX(-50%);z-index:6;height:36px;padding:0 14px;border-radius:18px;background:var(--bg-surface);box-shadow:var(--e2);font-weight:600;font-size:13px;color:var(--indigo-600);display:flex;align-items:center;gap:6px}

.dhead{height:260px;flex:none;position:relative}

.src{background:var(--green-100);color:var(--green-700);border-radius:var(--r-md);padding:12px;display:flex;gap:10px;align-items:flex-start}
.cta{padding:12px 16px 16px;background:var(--bg-surface);border-top:1px solid var(--border);display:flex;gap:12px}
/* itinerary */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px 12px}
.stop{display:flex;gap:12px}
.stop .rail{display:flex;flex-direction:column;align-items:center;width:32px;flex:none}
.stop .num{width:32px;height:32px;border-radius:50%;background:var(--indigo-600);color:#fff;font-weight:700;display:grid;place-items:center;flex:none}
.stop .line{flex:1;width:2px;background:repeating-linear-gradient(var(--indigo-200) 0 4px,transparent 4px 8px);margin:4px 0}
.stop .body{flex:1;padding:12px;margin-bottom:8px}
.leg{font-size:12px;color:var(--text-3);padding:2px 0 10px;display:flex;align-items:center;gap:6px}
.warn{background:var(--kunyit-50);color:var(--kunyit-700);border:1px solid var(--kunyit-100);border-radius:var(--r-md);padding:10px 12px;display:flex;gap:8px;font-size:12px;line-height:16px;font-weight:600;margin-top:8px}
.empty{padding:48px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .art{width:120px;height:120px;border-radius:50%;background:var(--indigo-600) var(--kawung);display:grid;place-items:center;color:#fff}
.empty .art svg{width:44px;height:44px}
/* events */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 16px 12px}
.cal button{height:64px;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--bg-surface);border:1px solid var(--border)}
.cal button.on{background:var(--indigo-600);color:#fff;border-color:var(--indigo-600)}
.cal .d{width:5px;height:5px;border-radius:50%;background:var(--kunyit-500)}
/* sheet/dialog/snack */
.scrim{position:absolute;inset:0;background:rgba(23,21,18,.5);z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--bg-surface);border-radius:24px 24px 0 0;padding:12px 16px 24px;box-shadow:var(--esheet);display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--n300);margin:0 auto 4px}
.snack{position:absolute;left:16px;right:16px;bottom:88px;background:var(--n900);color:#fff;border-radius:var(--r-md);padding:12px 16px;z-index:50;font-weight:600;animation:up .2s}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.field{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.hdr{padding:12px 16px 8px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}.gap8{display:flex;flex-direction:column;gap:8px}

function gen(){
  let pool=A.filter(a=>!st.ints.length||st.ints.includes(a.cat));
  const per=st.trav==='family'?2:3,days=[];
  const fixed=pool.filter(a=>a.at),free=pool.filter(a=>!a.at);
  if(free.length<st.days*per)A.filter(a=>!a.at&&!free.includes(a)).forEach(a=>free.length<st.days*per&&free.push(a)); // pad with nearby picks outside chosen interests
  let cur=free[0],left=free.slice();
  for(let d=0;d<st.days;d++){const day=[];while(day.length<per&&left.length){const n=cur?left.reduce((b,a)=>dist(cur,a)<dist(cur,b)?a:b):left[0];day.push(n.id);left=left.filter(a=>a!==n);cur=n}
    const f=fixed[d];if(f)day.push(f.id);days.push(day);cur=null;if(left.length)cur=left[0]}
  st.plan=days;st.day=0}
function timeline(ids){let t=540,out=[],prev=null;

  return `<div class="hdr"><h1 class="h-lg">Acara & pertunjukan</h1><p class="sec b-sm">Jadwal pertunjukan budaya minggu ini.</p></div>
  <div class="cal">${[...Array(7)].map((_,i)=>{const d=new Date(now.getTime()+i*864e5),w=d.getDay();return `<button class="${st.evDay===w?'on':''}" data-a="evd" data-v="${w}"><span class="b-sm" style="opacity:.8">${names[w]}</span><b>${d.getDate()}</b>${A.some(a=>a.days&&a.days.includes(w))?'<i class="d"></i>':'<i style="height:5px"></i>'}</button>`}).join('')}</div>
  <div class="scroll" style="padding:0 16px 16px"><div class="gap8" style="gap:12px">${ev.length?ev.map(a=>`<button class="card" style="display:flex;gap:12px;padding:10px;text-align:left" data-a="det" data-v="${a.id}">${cover(a).replace('class="cover "','class="cover " ').replace('<div class="cover','<div style="width:84px;border-radius:12px;flex:none" class="cover')}<div style="flex:1;min-width:0" class="gap8"><span class="lbl" style="color:var(--cat-pertunjukan)">Mulai ${a.at}</span><b class="t-md" style="line-height:20px">${a.name}</b><span class="b-sm sec">Di ${a.host}</span><span class="b-sm ter">${a.sched} · ${rp(a.p)}</span></div></button>`).join(''):`<div class="empty"><div class="art">${ic('cal')}</div><b class="t-md">Tidak ada pertunjukan hari ini</b><span class="sec">Coba pilih tanggal lain.</span></div>`}</div></div>`}
function profil(){return `<div class="hdr"><h1 class="h-lg">Profil</h1></div><div class="scroll" style="padding:0 16px 16px"><div class="card" style="padding:16px;display:flex;gap:12px;align-items:center"><span class="ib" style="background:var(--indigo-100);color:var(--indigo-600)">${ic('user')}</span><div style="flex:1"><b class="t-md">${st.saved?'Rahma P.':'Tamu'}</b><div class="b-sm sec">${st.saved?'Masuk dengan Google':'Masuk untuk menyimpan rencanamu'}</div></div>${st.saved?'':`<button class="btn s" style="height:40px" data-a="login">Masuk</button>`}</div>
  <h3 class="t-lg" style="margin:20px 0 4px">Rencana tersimpan</h3>${st.saved&&st.plan.flat().length?`<div class="card" style="padding:14px;margin-top:8px"><b class="t-md">Rencana ${st.days} hari · Yogyakarta</b><div class="b-sm sec">${st.plan.flat().length} tempat budaya</div></div>`:`<p class="sec" style="padding:12px 0">Belum ada rencana tersimpan.</p>`}
  <h3 class="t-lg" style="margin:20px 0 4px">Preferensi</h3><div class="field"><span>Tipe traveler</span><b>${TRAV.find(t=>t[0]===st.trav)?.[1]||'—'}</b></div><div class="field"><span>Minat</span><b>${st.ints.map(i=>CAT[i].n).join(', ')||'Semua'}</b></div><button class="btn s w" style="margin-top:16px" data-a="redo">Ulangi onboarding</button></div>`}
function main(){const t=st.tab;return `<div class="screen">${t==='jelajah'?jelajah():t==='rencana'?rencana():t==='acara'?acara():profil()}${nav()}</div>`}
function overlays(){
  if(st.sheet==='login')return `<div class="scrim" data-a="close"><div class="sheet" data-stop><div class="grab"></div><h3 class="h-md">Simpan rencanamu</h3><p class="sec">Masuk agar rencana tersimpan dan bisa dibuka di perangkat lain.</p><button class="btn p w" data-a="dologin">Lanjut dengan Google</button><button class="btn t w" data-a="close">Nanti saja</button></div></div>`;
  if(st.sheet==='share')return `<div class="scrim" data-a="close"><div class="sheet" data-stop><div class="grab"></div><h3 class="h-md">Bagikan rencana</h3><p class="sec">Penerima bisa melihat rencanamu dan menyalinnya ke akun mereka.</p><div class="card" style="padding:12px;display:flex;gap:8px;align-items:center;color:var(--indigo-600)">${ic('link')}<span class="b-sm" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">budayago.app/r/k7x2m9qa</span></div><button class="btn p w" data-a="copy">Salin link</button></div></div>`;return ''}
function render(){const app=document.getElementById('app'),q=document.activeElement&&document.activeElement.dataset.a==='q';
  app.innerHTML=(st.scr==='onb'?onb():main())+(st.det?detail():'')+overlays()+(st.snack?`<div class="snack">${st.snack}</div>`:'');
  if(q){const i=app.querySelector('input');i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.dataset.a==='q')return;if(e.target.closest('[data-stop]')&&t.classList.contains('scrim'))return;
  const a=t.dataset.a,v=t.dataset.v;
  const F={tab:()=>go({tab:v,det:null,sel:null}),trav:()=>go({trav:v}),int:()=>go({ints:st.ints.includes(v)?st.ints.filter(x=>x!==v):[...st.ints,v]}),days:()=>go({days:Math.min(7,Math.max(1,st.days+ +v))}),
  onx:()=>{if(st.step<3)go({step:st.step+1});else{gen();go({scr:'main',tab:'rencana'})}},obk:()=>go({step:st.step-1}),skip:()=>go({scr:'main',tab:'jelajah'}),
  flt:()=>go({filter:v,sel:null}),pin:()=>go({sel:+v}),area:()=>snack('Menampilkan tempat di area peta ini'),det:()=>go({det:+v}),back:()=>go({det:null}),snk:()=>snack(v),
  add:()=>{if(!st.plan.length)st.plan=[[]];st.plan[st.day].push(+v);go({det:null,tab:'rencana'});snack('Ditambahkan ke Hari '+(st.day+1))},
  day:()=>go({day:+v}),addday:()=>{st.plan.push([]);go({days:st.plan.length,day:st.plan.length-1})},
  mv:()=>{const[i,d]=v.split(':').map(Number),p=st.plan[st.day],j=i+d;if(j<0||j>=p.length)return;[p[i],p[j]]=[p[j],p[i]];render()},
  rm:()=>{st.plan[st.day].splice(+v,1);render()},save:()=>st.saved?snack('Rencana sudah tersimpan'):go({sheet:'login'}),login:()=>go({sheet:'login'}),dologin:()=>{go({saved:true,sheet:null});snack('Rencana tersimpan')},
  share:()=>go({sheet:'share'}),copy:()=>{try{navigator.clipboard.writeText('budayago.app/r/k7x2m9qa')}catch(_){}go({sheet:null});snack('Link disalin')},close:()=>go({sheet:null}),
  evd:()=>go({evDay:+v}),redo:()=>go({scr:'onb',step:1,det:null})};
  F[a]&&F[a]()});
document.addEventListener('input',e=>{if(e.target.dataset.a==='q'){st.q=e.target.value;st.sel=null;render()}});
render();
</script>
</body>
</html>
